<svg viewBox="0 0 680 450" role="img" aria-label="Diagram of an ICC trial: three judges decide; the prosecutor must prove each charge with evidence; the defense answers for the accused, who is presumed innocent; lawyers for the victims speak for the families." xmlns="http://www.w3.org/2000/svg"><title>Who is in an ICC courtroom?</title><style>text{font:600 15px "Source Sans 3",Helvetica,Arial,sans-serif;fill:#1c1a17}.h{font-weight:800;font-size:17px}.s{font-size:14px;fill:#4b463f}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8a6414"/></marker><marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b4432f"/></marker><marker id="ar3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2f5f8a"/></marker></defs><rect x="0" y="0" width="680" height="450" rx="16" fill="#fbf8f2"/><text class="h" x="340" y="30" text-anchor="middle" style="font-size:19px">Who is in an ICC courtroom?</text><rect x="210" y="92" width="260" height="34" rx="6" fill="#e7dcc6" stroke="#c9bfae"/><g transform="translate(280 88) scale(1)"><circle cx="0" cy="-26" r="11" fill="#1c1a17"/><path d="M-18 8 Q-18 -12 0 -12 Q18 -12 18 8 Z" fill="#1c1a17"/></g><g transform="translate(340 88) scale(1)"><circle cx="0" cy="-26" r="11" fill="#1c1a17"/><path d="M-18 8 Q-18 -12 0 -12 Q18 -12 18 8 Z" fill="#1c1a17"/></g><g transform="translate(400 88) scale(1)"><circle cx="0" cy="-26" r="11" fill="#1c1a17"/><path d="M-18 8 Q-18 -12 0 -12 Q18 -12 18 8 Z" fill="#1c1a17"/></g><text class="h" x="340" y="150" text-anchor="middle">3 judges</text><text class="s" x="340" y="168" text-anchor="middle">listen to both sides, then decide</text><g transform="translate(90 262) scale(1.1)"><circle cx="0" cy="-26" r="11" fill="#b4432f"/><path d="M-18 8 Q-18 -12 0 -12 Q18 -12 18 8 Z" fill="#b4432f"/></g><rect x="40" y="274" width="100" height="16" rx="4" fill="#e7dcc6"/><text class="h" x="90" y="318" text-anchor="middle" style="fill:#b4432f">Prosecutor</text><text class="s" x="90" y="336" text-anchor="middle">must prove</text><text class="s" x="90" y="353" text-anchor="middle">each charge</text><g transform="translate(520 262) scale(1.1)"><circle cx="0" cy="-26" r="11" fill="#2f5f8a"/><path d="M-18 8 Q-18 -12 0 -12 Q18 -12 18 8 Z" fill="#2f5f8a"/></g><g transform="translate(615 262) scale(1.1)"><circle cx="0" cy="-26" r="11" fill="#7a7166"/><path d="M-18 8 Q-18 -12 0 -12 Q18 -12 18 8 Z" fill="#7a7166"/></g><rect x="485" y="274" width="165" height="16" rx="4" fill="#e7dcc6"/><text class="h" x="520" y="318" text-anchor="middle" style="fill:#2f5f8a">Defense</text><text class="s" x="520" y="336" text-anchor="middle">answers</text><text class="s" x="520" y="353" text-anchor="middle">for the accused</text><text class="h" x="615" y="318" text-anchor="middle">Accused</text><text class="s" x="615" y="336" text-anchor="middle">presumed</text><text class="s" x="615" y="353" text-anchor="middle">innocent</text><g transform="translate(205 352) scale(0.95)"><circle cx="0" cy="-26" r="11" fill="#55662a"/><path d="M-18 8 Q-18 -12 0 -12 Q18 -12 18 8 Z" fill="#55662a"/></g><g transform="translate(247 352) scale(0.95)"><circle cx="0" cy="-26" r="11" fill="#55662a"/><path d="M-18 8 Q-18 -12 0 -12 Q18 -12 18 8 Z" fill="#55662a"/></g><text class="h" x="226" y="394" text-anchor="middle" style="fill:#55662a">Victims' lawyers</text><text class="s" x="226" y="411" text-anchor="middle">speak for the families</text><g transform="translate(400 332)"><rect x="-34" y="-28" width="44" height="56" rx="3" fill="#fff" stroke="#8a6414" stroke-width="2"/><rect x="-22" y="-36" width="44" height="56" rx="3" fill="#fff" stroke="#8a6414" stroke-width="2"/><line x1="-14" y1="-22" x2="14" y2="-22" stroke="#8a6414" stroke-width="2"/><line x1="-14" y1="-12" x2="14" y2="-12" stroke="#8a6414" stroke-width="2"/><line x1="-14" y1="-2" x2="8" y2="-2" stroke="#8a6414" stroke-width="2"/></g><text class="h" x="400" y="384" text-anchor="middle" style="fill:#8a6414">Evidence</text><text class="s" x="400" y="401" text-anchor="middle">documents, witnesses,</text><text class="s" x="400" y="418" text-anchor="middle">videos</text><path d="M398 292 Q392 230 360 182" fill="none" stroke="#8a6414" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#ar)"/><path d="M120 238 Q150 170 200 118" fill="none" stroke="#b4432f" stroke-width="2" marker-end="url(#ar2)"/><path d="M540 230 Q530 170 482 118" fill="none" stroke="#2f5f8a" stroke-width="2" marker-end="url(#ar3)"/></svg>